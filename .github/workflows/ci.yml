name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # smithy-engine is not on PyPI yet — install the core from git
      - run: pip install "smithy-engine @ git+https://github.com/as-kurosss/smithy-core.git" fastapi uvicorn "textual>=8.2.8" mypy
      - run: pip install -e . --no-deps
      - run: mypy src/smithy_designer --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: designer-web/package-lock.json
      - run: npm ci
        working-directory: designer-web
      - run: npm run build
        working-directory: designer-web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install build
      - run: npm ci
        working-directory: designer-web
      - run: npm run build
        working-directory: designer-web
      - name: Build wheel (bundles the UI into src/smithy_designer/static)
        run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
